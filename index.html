<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="src/favicon/favicon-32x32.png" type="image/x-icon">

    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/md.css">
    <title>NewsHub</title>
</head>

<body>
    <header class="header">
        <a href="#">
            <img src="src/image/logo.png" alt="Logo do NewsHub">
            <p>As notícias mais relevantes do seu dia, organizadas por tema.</p>
        </a>
    </header>

    <nav class="category-navigation">
        <ul>
            <li>
                <button data-category="technology" class="btn">Tecnologia</button>
            </li>

            <li>
                <button data-category="economy" class="btn">Economia</button>
            </li>


            <li>
                <button data-category="science" class="btn">Ciência</button>
            </li>

            <li>
                <button data-category="health" class="btn">Saúde</button>
            </li>

            <li>
                <button data-category="sports" class="btn">Esportes</button>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <section class="featured-news"></section>
        <article class="news"></article>
    </main>

            <footer class="footer">
                <p class="copyright">&copy; 2026 NewsHub. Todos os direitos reservados.</p>

                        target="_blank">Jhonyson Bastos</a>.</p>

    <script src="src/js/script.js"></script>
